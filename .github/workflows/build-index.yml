name: build index

# After a merge that touches mods/, rebuild index.json (the file the game downloads) from every entry.
on:
  push:
    branches: [main]
    paths: ["mods/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-index

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pefile
      - name: Validate every entry (downloads each mod)
        run: python scripts/cadence_index.py validate --all
      - name: Build index.json
        run: python scripts/cadence_index.py build
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json; then echo "index.json unchanged"; exit 0; fi
          git config user.name "cadence-index[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push