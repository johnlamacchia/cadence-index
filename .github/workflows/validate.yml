name: validate

# Every pull request that adds or changes a mod entry is checked: the entry's fields, then the real download
# (hash, size, 64-bit DLL, exports mod_main). Nothing is merged until this passes and a person has read the source.
on:
  pull_request:
    paths: ["mods/**", "scripts/**", "index.json"]
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pefile
      - name: Self-test the validator
        run: python scripts/selftest.py
      - name: index.json is built by the bot, not edited by hand
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'index.json'; then
            echo "Please do not edit index.json: it is rebuilt from mods/ after the merge."; exit 1
          fi
      - name: Validate the entries this pull request adds or changes
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'mods/*.json')
          if [ -n "$files" ]; then python scripts/cadence_index.py validate $files; else echo "no mod entries changed"; fi